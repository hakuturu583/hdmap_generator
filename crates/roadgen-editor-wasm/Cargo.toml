[package]
name = "roadgen-editor-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The roadgen editor's engine for the browser: builds a document into the IR, draws it, and writes it in every format, compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roadgen-core.workspace = true
roadgen-editor = { workspace = true, features = ["serde"] }
roadgen-irview = { workspace = true, features = ["serde"] }
roadgen-opendrive.workspace = true
roadgen-lanelet2.workspace = true
roadgen-osm.workspace = true
roadgen-sumo.workspace = true
roadgen-gpudrive.workspace = true
roadgen-commonroad.workspace = true
roadgen-proto.workspace = true
# The land: hills, rivers, heaps and pads generated round the roads, as the CARLA
# export and the Python package generate it.
roadgen-carla.workspace = true
serde.workspace = true
serde_json.workspace = true
# The bridge to JavaScript. MIT/Apache-2.0. Unpinned beyond the minor version: the
# build reads the exact version back out of Cargo.lock and installs the matching
# `wasm-bindgen` command, which must agree with the library to the patch.
wasm-bindgen = "0.2"

# The land's building grammar draws on `rand`, whose `getrandom` has no source of
# randomness on a bare WebAssembly target until it is told to use the browser's:
# the `wasm_js` feature, with the `getrandom_backend` cfg that build.sh passes.
# Nothing here asks it for randomness — every seed is the document's — but it has
# to compile.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
