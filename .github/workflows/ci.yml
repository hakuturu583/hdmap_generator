name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # aarch64 natively rather than under emulation: the release ships an aarch64
        # wheel, and this is what checks that it behaves like the x86_64 one.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The SUMO export is checked by handing it to SUMO: netconvert builds the
      # network and sumo loads it. ROADGEN_REQUIRE_SUMO turns the tests' "SUMO is not
      # installed, skipping" into a failure, so losing the install cannot quietly stop
      # those checks running.
      - name: Install SUMO
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sumo
      # The version is in three files and the release workflow refuses to publish
      # unless they agree; better to hear about a lock file that lags here than on
      # release day.
      - name: The version files agree
        if: matrix.os == 'ubuntu-latest'
        run: |
          PKG=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          CRATE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "$PKG" = "$CRATE"
          cargo metadata --locked --format-version 1 >/dev/null
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
        env:
          ROADGEN_REQUIRE_SUMO: "1"

  python:
    strategy:
      fail-fast: false
      matrix:
        # aarch64 natively rather than under emulation: the release ships an aarch64
        # wheel, and this is what checks that it behaves like the x86_64 one.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # netconvert builds the SUMO network the export describes; sumolib, SUMO's
      # own Python library, reads what it built. ROADGEN_REQUIRE_SUMO below turns the
      # tests' "not installed, skipping" into a failure.
      - name: Install netconvert
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sumo
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pandas and pyarrow are how the ClipGT tests read the written parquet,
          # which is how a Cosmos reader reads it. sumolib reads the SUMO network.
          pip install maturin pytest pandas pyarrow sumolib
          maturin build --release --out dist
          pip install --find-links dist roadgen
      - name: Test
        run: python -m pytest tests/python -q
        env:
          ROADGEN_REQUIRE_SUMO: "1"
