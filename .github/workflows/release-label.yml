# Every pull request says what it does to the version, before it can be merged.
#
# Every merge is a release: the release workflow reads a `release:major|minor|patch`
# label off each merged PR to decide the level, and there is no label for "nothing"
# — a change on main that is not worth a patch release is not worth merging. So
# exactly one of the three, or this check fails. It is a required status check on
# `main`, which is what turns a failed check into a blocked merge.
#
# It re-runs when labels change, so fixing the label is enough; no new push needed.

name: Release label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read   # the PR's labels, read as they are now

# No concurrency group. Opening a PR with a label is two events -- `opened`, then
# `labeled` a moment later -- and a group that cancelled the older run left a
# cancelled check on every such PR, which reads as a failure. Instead each run
# reads the PR's labels as they are when it runs, not the event's snapshot of
# them, so every run gives the PR's current answer and none has to be cancelled.

jobs:
  label:
    name: the PR carries exactly one release label
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          release_labels() {
            gh pr view "$PR" -R "$REPO" --json labels --jq '.labels[].name' \
              | grep -E '^release:(major|minor|patch)$' || true
          }
          found=$(release_labels)
          # A PR opened with a label gets it a moment after it is opened, and the
          # run for `opened` can start in between. Give it that moment before
          # calling the PR unlabelled.
          for _ in 1 2 3 4 5 6; do
            [ -n "$found" ] && break
            sleep 5
            found=$(release_labels)
          done
          count=$(printf '%s' "$found" | grep -c . || true)
          case "$count" in
            1) echo "Release label: $found" ;;
            0) echo "::error::Add exactly one of release:major, release:minor or release:patch to this pull request -- every merge is a release, and a patch is the least it can be"; exit 1 ;;
            *) echo "::error::More than one release label ($(echo $found)) -- keep exactly one"; exit 1 ;;
          esac
