[workspace]
resolver = "2"
members = [
    "crates/roadgen-core",
    "crates/roadgen-opendrive",
    "crates/roadgen-lanelet2",
    "crates/roadgen-clipgt",
    "crates/roadgen-osm",
    "crates/roadgen-sumo",
    "crates/roadgen-python",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/hakuturu583/hdmap_generator"
homepage = "https://github.com/hakuturu583/hdmap_generator"

[workspace.dependencies]
roadgen-core = { path = "crates/roadgen-core", version = "0.1.0" }
roadgen-opendrive = { path = "crates/roadgen-opendrive", version = "0.1.0" }
roadgen-lanelet2 = { path = "crates/roadgen-lanelet2", version = "0.1.0" }
roadgen-clipgt = { path = "crates/roadgen-clipgt", version = "0.1.0" }
roadgen-osm = { path = "crates/roadgen-osm", version = "0.1.0" }
roadgen-sumo = { path = "crates/roadgen-sumo", version = "0.1.0" }

# OpenDRIVE 1.7 data model, parser and writer. MIT, which an Apache-2.0 project may
# redistribute. Used so that neither the XML schema nor its serializer is rewritten
# here; `roadgen-opendrive` only lowers the canonical IR onto these types.
opendrive = "0.1.0"
uom = "0.32"
vec1 = "1.8"

# simple_lanelet2: the Lanelet2 data model, OSM XML reader/writer and projections.
# BSD-3-Clause, which an Apache-2.0 project may redistribute. Pinned by revision so
# that a build is reproducible; the crates are not published to crates.io.
ll2-core = { git = "https://github.com/hakuturu583/simple_lanelet2", rev = "024f149195d25a600f8559d7e1ae3035041cc484" }
ll2-io = { git = "https://github.com/hakuturu583/simple_lanelet2", rev = "024f149195d25a600f8559d7e1ae3035041cc484" }
ll2-projection = { git = "https://github.com/hakuturu583/simple_lanelet2", rev = "024f149195d25a600f8559d7e1ae3035041cc484" }
ll2-routing = { git = "https://github.com/hakuturu583/simple_lanelet2", rev = "024f149195d25a600f8559d7e1ae3035041cc484" }
ll2-traffic-rules = { git = "https://github.com/hakuturu583/simple_lanelet2", rev = "024f149195d25a600f8559d7e1ae3035041cc484" }

# quick-xml, for the SUMO plain-XML network. MIT, which an Apache-2.0 project may
# redistribute. SUMO's node, edge and connection files have no data model worth
# depending on — they are attributes on flat elements — so what is borrowed here is
# the writer: correct escaping and indentation, rather than a `format!` per element.
quick-xml = "0.41"

# Arrow and Parquet, for ClipGT's nested per-layer tables. Both Apache-2.0, so an
# Apache-2.0 project may redistribute them. Used so that neither the Parquet
# container nor the Arrow type system is rewritten here.
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = ["arrow", "snap"] }

# The ClipGT scenario file, and the rig JSON a clip's calibration table carries.
# serde and serde_json are MIT/Apache-2.0; serde_norway is the maintained fork of
# serde_yaml, under the same licences.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"

pyo3 = "0.29"

tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
