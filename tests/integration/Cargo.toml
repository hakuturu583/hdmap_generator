[package]
name = "roadgen-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Scenario and cross-format tests for roadgen"

[dependencies]
roadgen-core.workspace = true
roadgen-opendrive.workspace = true
roadgen-lanelet2.workspace = true
roadgen-clipgt.workspace = true
roadgen-gpudrive.workspace = true
roadgen-osm.workspace = true
roadgen-sumo.workspace = true
roadgen-viewer.workspace = true
opendrive.workspace = true
ll2-core.workspace = true
ll2-io.workspace = true
ll2-projection.workspace = true
ll2-routing.workspace = true
ll2-traffic-rules.workspace = true
quick-xml.workspace = true
arrow.workspace = true
parquet.workspace = true
tempfile.workspace = true
# `float_roundtrip` so that a scene read back here is the one that was written:
# serde_json's default parser is fast rather than exact, while the writer already
# emits the shortest text that round-trips an f64 — and GPUDrive's own reader, strtod
# through nlohmann, is exact. Without it these tests would compare against a number
# the simulator never sees.
serde_json = { workspace = true, features = ["float_roundtrip"] }
